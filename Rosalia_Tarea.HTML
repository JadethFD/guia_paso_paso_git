<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo </title>
    <style>
        * {
            box-sizing: border-box;
           
        }

        body {
            font-family: Arial, sans-serif;
            
            background-image: url(https://i.pinimg.com/736x/a2/b1/e4/a2b1e47a82ae7052d2efd60cd9504117.jpg);
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(65, 45, 14, 0.2);
            text-align: center;
            width: 320px;
        }
        h1 {
            color: #4b3e2e;
            margin-bottom: 20px;
            font-size: 24px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #e496bc;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>¡Hola Mundo!</h1>
        <input type="text" placeholder="Escribe tu nombre aqui">
    </div>

</body>
</html>
